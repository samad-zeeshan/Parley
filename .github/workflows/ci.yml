name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic suite: no model, no LM Studio, no sound card. Also checks the README tables still match
  # eval/results.json.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m eval.report --check

  # The four deployment gates on a kind cluster.
  k8s:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: parley
          config: deploy/kind/cluster.yaml
      - name: Gate 1, image builds
        run: docker build -t parley:dev .
      - name: Gate 2, pods ready
        run: |
          kind load docker-image parley:dev --name parley
          kubectl apply -k deploy/k8s
          kubectl -n parley rollout status deploy/parley --timeout=180s
          kubectl -n parley rollout status deploy/prometheus --timeout=180s
          kubectl -n parley rollout status deploy/grafana --timeout=180s
          kubectl -n parley wait --for=condition=Ready pod --all --timeout=180s
      - name: Gate 3, one scripted booking completes
        run: python3 deploy/ci_booking.py http://127.0.0.1:8000
      - name: Gate 4, deployed config matches the manifest
        run: python3 deploy/check_config.py http://127.0.0.1:8000
      - name: Metrics are scraped
        run: |
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:9090/api/v1/query?query=parley_booking_actions_total' | grep -q '"action":"confirm"'; then
              echo "prometheus has the booking"; exit 0
            fi
            sleep 2
          done
          echo "prometheus never scraped the booking"; exit 1
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n parley get all
          kubectl -n parley describe pods
          kubectl -n parley logs deploy/parley --tail=200
