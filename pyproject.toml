[project]
name = "parley"
version = "0.1.0"
description = "Bilingual Arabic and English voice agent that books property viewings against a local booking API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.1",
    "piper-tts>=1.8.0",
]
jev = [
    "torch>=2.4",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "models: needs downloaded ASR/TTS models or a running LM Studio; skipped by default",
]
addopts = "-m 'not models'"
