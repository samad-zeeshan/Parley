# One node is enough for a demo and for CI. Ports bind to loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: majlis
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # service, agent and demo page
        hostPort: 8000
        listenAddress: 127.0.0.1
      - containerPort: 30300   # Grafana
        hostPort: 3000
        listenAddress: 127.0.0.1
      - containerPort: 30090   # Prometheus
        hostPort: 9090
        listenAddress: 127.0.0.1
